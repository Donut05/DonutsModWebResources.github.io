<!doctype html>
<html lang="en">

<head>
    <title>HALF-LIFE NOW!</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: #000;
            font-family: "HL2", system-ui, sans-serif;
        }

        @font-face {
            font-family: "HL2";
            src: url("./website/fonts/DINOT-Light.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        .element {
            width: 33%;
            height: 95%;
        }

        .elementMirrored {
            width: 33%;
            height: 95%;
            transform: scale(-1, 1);
        }

        .text {
            color: #ffffff;
            position: absolute;
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            padding: 10px 20px; 
            font-size: 500%;
            text-align: center;
            user-select: none
        }

        .start-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 80;
            background: #000;
            cursor: pointer
        }

        .startText {
            color: #ffffff;
            font: "HL2";
            font-size: clamp(18px, 3.5vw, 48px);
            text-align: center;
            opacity: 0.98;
            letter-spacing: 0.04em;
            user-select: none
        }
    </style>
</head>

<body>
    <div>
      <audio id="vineBoom" src="website/audio/vine-boom.mp3" preload="auto" hidden="true"></audio>
    </div>
    <div>
      <audio id="alarm" src="website/audio/alarm.mp3" loop="true" preload="auto" hidden="true"></audio>
    </div>
    <img class="element" src="https://web.archive.org/web/20070824183151if_/http://www.geocities.com/aikidopaz/new3.gif" />
    <img class="element" src="website/images/hl3/logo.png" />
    <img class="elementMirrored" src="https://web.archive.org/web/20070824183151if_/http://www.geocities.com/aikidopaz/new3.gif" />
    <div class="text" id="text">HALF-LIFE 3 NOW!!!</div>

    <div id="startOverlay" class="start-overlay" role="button">
        <div class="startText" id="startText">HALF-LIFE WHEN?</div>
    </div>
</body>
<script>
    let started = false;
    let color = false;
    let timer = 100;

    function unlockAndStart() {
        if (started) return;
        started = true;

        document.getElementById('vineBoom').play();
        document.getElementById('alarm').play();

        let overlay = document.getElementById("startOverlay");
        overlay.remove();
    }

    document.getElementById('startOverlay').addEventListener('click', () => { unlockAndStart(); });
    document.getElementById('startOverlay').addEventListener('touchstart', (e) => { e.preventDefault(); unlockAndStart(); }, { passive: false });
    window.addEventListener('keydown', (e) => { if (!started) { unlockAndStart(); } });
</script>

</html>
